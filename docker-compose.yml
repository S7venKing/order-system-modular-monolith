version: '3.9'

services:
  order-system-modular-monolith.api:
    image: ${DOCKER_REGISTRY-}ordersystemmodularmonolithapi
    build:
      context: .
      dockerfile: order-system-modular-monolith.Api/Dockerfile
    container_name: orders-api
    depends_on:
      - redis
      - postgres
      - mongo
    environment:
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ordersdb;Username=postgres;Password=postgres
      ConnectionStrings__Mongo: mongodb://mongo:27017/orders-mongo
    ports:
      - "5000:8080"
    networks:
      - orders-network

  redis:
    image: redis:7
    container_name: redis
    volumes:
      - redis-data:/data
    networks:
      - orders-network

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - orders-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - orders-network

  mongo:
    image: mongo:7
    container_name: mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - orders-network

volumes:
  redis-data:
  postgres-data:
  mongo-data:

networks:
  orders-network:
    driver: bridge