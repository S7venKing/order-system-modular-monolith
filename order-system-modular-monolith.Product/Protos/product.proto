syntax = "proto3";
option csharp_namespace = "order_system_modular_monolith.Product.Protos";

service ProductService {
  rpc GetProduct (GetProductRequest) returns (GetProductResponse);
}

message GetProductRequest {
  string code = 1;
}

message GetProductResponse {
  string code = 1;
  string name = 2;
  double price = 3;
  bool found = 4;
}
